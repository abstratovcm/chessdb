[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chessdb"
version = "0.1.0"
description = "Compact SQLite database of chess positions with multi-criteria Stockfish eval trajectories"
requires-python = ">=3.11"
dependencies = ["chess>=1.11"]

[project.optional-dependencies]
site = ["fastapi", "uvicorn", "duckdb", "pyarrow"]
paper = ["pandas", "numpy", "matplotlib", "pillow", "zstandard"]
screenshots = ["playwright"]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
chessdb = "chessdb.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chessdb"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
markers = ["engine: needs a cached engine binary; self-skips otherwise"]
filterwarnings = [
    # starlette's TestClient still uses httpx this way; nothing to fix
    # on our side until starlette drops the shim.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
