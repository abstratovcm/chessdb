<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Arial, Liberation Sans, sans-serif" font-size="22">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1400" height="560" fill="#fff"/>

  <!-- Fonte externa -->
  <rect x="40" y="200" width="200" height="110" rx="10" fill="#f2f2f2" stroke="#000" stroke-width="2"/>
  <text x="140" y="245" text-anchor="middle" font-weight="bold">Lichess</text>
  <text x="140" y="275" text-anchor="middle" font-size="18">dump PGN (.zst)</text>
  <text x="140" y="298" text-anchor="middle" font-size="18">fluxo HTTP</text>

  <!-- Ingestão -->
  <rect x="300" y="180" width="230" height="150" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="415" y="215" text-anchor="middle" font-weight="bold">Ingestão</text>
  <text x="415" y="245" text-anchor="middle" font-size="18">PGN → FEN (python-chess)</text>
  <text x="415" y="270" text-anchor="middle" font-size="18">deduplicação (4 campos)</text>
  <text x="415" y="295" text-anchor="middle" font-size="18">filtro ≥ 6 peças</text>

  <!-- Redis -->
  <rect x="600" y="60" width="230" height="130" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="715" y="95" text-anchor="middle" font-weight="bold">Redis (fila)</text>
  <text x="715" y="125" text-anchor="middle" font-size="18">LPUSH / BRPOP</text>
  <text x="715" y="150" text-anchor="middle" font-size="18">visibility timeout 600 s</text>
  <text x="715" y="175" text-anchor="middle" font-size="18">tentativas ≤ 3</text>

  <!-- MongoDB -->
  <rect x="600" y="330" width="230" height="130" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="715" y="365" text-anchor="middle" font-weight="bold">MongoDB</text>
  <text x="715" y="395" text-anchor="middle" font-size="18">documento por FEN</text>
  <text x="715" y="420" text-anchor="middle" font-size="18">status + evaluations[]</text>
  <text x="715" y="445" text-anchor="middle" font-size="18">JSON Schema draft-07</text>

  <!-- Workers -->
  <rect x="900" y="180" width="230" height="150" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1015" y="215" text-anchor="middle" font-weight="bold">Executores (threads)</text>
  <text x="1015" y="245" text-anchor="middle" font-size="18">UCI · MultiPV = 3</text>
  <text x="1015" y="270" text-anchor="middle" font-size="18">Stockfish 16.0 / 16.1</text>
  <text x="1015" y="295" text-anchor="middle" font-size="18">limite por profundidade</text>

  <!-- FastAPI -->
  <rect x="1180" y="60" width="190" height="440" rx="10" fill="#f2f2f2" stroke="#000" stroke-width="2"/>
  <text x="1275" y="95" text-anchor="middle" font-weight="bold">FastAPI</text>
  <text x="1275" y="125" text-anchor="middle" font-size="18">painel de controle</text>
  <text x="1275" y="165" text-anchor="middle" font-size="18">gerar FENs</text>
  <text x="1275" y="190" text-anchor="middle" font-size="18">enfileirar</text>
  <text x="1275" y="215" text-anchor="middle" font-size="18">iniciar / parar</text>
  <text x="1275" y="240" text-anchor="middle" font-size="18">executores</text>
  <text x="1275" y="280" text-anchor="middle" font-size="18">estatísticas</text>
  <text x="1275" y="305" text-anchor="middle" font-size="18">em tempo real</text>
  <text x="1275" y="345" text-anchor="middle" font-size="18">explorar FENs</text>
  <text x="1275" y="385" text-anchor="middle" font-size="18">gráficos por</text>
  <text x="1275" y="410" text-anchor="middle" font-size="18">profundidade</text>
  <text x="1275" y="435" text-anchor="middle" font-size="18">(Chart.js)</text>

  <!-- Setas -->
  <line x1="240" y1="255" x2="298" y2="255" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="530" y1="230" x2="598" y2="140" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <text x="535" y="160" font-size="16">produtor</text>
  <line x1="530" y1="290" x2="598" y2="380" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <text x="470" y="395" font-size="16">status = pending</text>
  <line x1="830" y1="140" x2="898" y2="220" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <text x="868" y="150" font-size="16">consome FEN</text>
  <line x1="898" y1="300" x2="832" y2="380" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <text x="850" y="400" font-size="16">grava avaliações</text>
  <line x1="1130" y1="255" x2="1178" y2="255" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="1178" y1="440" x2="832" y2="440" stroke="#000" stroke-width="2" marker-end="url(#seta)" stroke-dasharray="8,6"/>
  <text x="960" y="470" font-size="16">consulta e enfileira do banco</text>

  <!-- Infra -->
  <rect x="580" y="30" width="270" height="450" rx="14" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="10,8"/>
  <text x="715" y="510" text-anchor="middle" font-size="16">Docker Compose (MongoDB :27017, Redis :6379)</text>
</svg>
